name: Release updater

on:
  push:
    branches: [main]

concurrency:
  group: release-updater
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: macos-14
    timeout-minutes: 45
    env:
      TARGET: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bump patch version
        id: version
        run: |
          git pull --ff-only origin main
          VERSION="$(node -p 'const [major, minor, patch] = require("./package.json").version.split(".").map(Number); `${major}.${minor}.${patch + 1}`')"
          while git rev-parse --verify --quiet "refs/tags/v$VERSION"; do
            VERSION="$(VERSION="$VERSION" node -p 'const [major, minor, patch] = process.env.VERSION.split(".").map(Number); `${major}.${minor}.${patch + 1}`')"
          done
          VERSION="$VERSION" node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from "node:fs";

          const version = process.env.VERSION;
          for (const file of ["package.json", "src-tauri/tauri.conf.json"]) {
            const value = JSON.parse(readFileSync(file, "utf8"));
            value.version = version;
            writeFileSync(file, `${JSON.stringify(value, null, 2)}\n`);
          }
          for (const file of ["src-tauri/Cargo.toml", "src-tauri/Cargo.lock"]) {
            const value = readFileSync(file, "utf8");
            writeFileSync(file, value.replace(/(name = "command-rdev-center"\nversion = ")[^"]+/, `$1${version}`));
          }
          JS
          pnpm check:version
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Test
        run: pnpm test && cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build signed updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: pnpm tauri build --target "$TARGET" --bundles app

      - name: Prepare release files
        id: files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          artifact=$(find src-tauri/target/$TARGET/release/bundle/macos -name '*.app.tar.gz' -type f -print -quit)
          test -n "$artifact"
          test -f "$artifact.sig"
          filename="command-rdev-center_${VERSION}_aarch64.app.tar.gz"
          cp "$artifact" "$RUNNER_TEMP/$filename"
          cp "$artifact.sig" "$RUNNER_TEMP/$filename.sig"
          python3 - "$RUNNER_TEMP/$filename.sig" "$RUNNER_TEMP/latest.json" "$VERSION" "$filename" "$GITHUB_SHA" <<'PY'
          import datetime, json, pathlib, sys
          signature_file, output, version, filename, commit = sys.argv[1:]
          payload = {
              "version": version,
              "notes": f"Build {version} ({commit[:7]})",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "platforms": {
                  "darwin-aarch64": {
                      "signature": pathlib.Path(signature_file).read_text().strip(),
                      "url": f"https://updates.rdev.web.id/command-rdev-center/{filename}",
                  }
              },
          }
          pathlib.Path(output).write_text(json.dumps(payload, indent=2) + "\n")
          PY
          echo "artifact=$RUNNER_TEMP/$filename" >> "$GITHUB_OUTPUT"

      - name: Upload to updater VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          ARTIFACT: ${{ steps.files.outputs.artifact }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/updater
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/updater ~/.ssh/known_hosts
          ssh_opts=(-i ~/.ssh/updater -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3)
          scp "${ssh_opts[@]}" "$ARTIFACT" "$VPS_USER@$VPS_HOST:/var/www/updates/command-rdev-center/"
          scp "${ssh_opts[@]}" "$ARTIFACT.sig" "$VPS_USER@$VPS_HOST:/var/www/updates/command-rdev-center/"
          scp "${ssh_opts[@]}" "$RUNNER_TEMP/latest.json" "$VPS_USER@$VPS_HOST:/var/www/updates/command-rdev-center/latest.json.tmp"
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" 'mv /var/www/updates/command-rdev-center/latest.json.tmp /var/www/updates/command-rdev-center/latest.json'
          curl --fail --retry 5 --retry-delay 2 "https://updates.rdev.web.id/command-rdev-center/latest.json"

      - name: Commit and tag release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "chore(release): v$VERSION"
          git tag "v$VERSION"
          git push origin HEAD:main "v$VERSION"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          ARTIFACT: ${{ steps.files.outputs.artifact }}
        run: |
          gh release create "v$VERSION" \
            "$ARTIFACT" \
            "$ARTIFACT.sig" \
            "$RUNNER_TEMP/latest.json" \
            --verify-tag \
            --title "Command RDEV Center v$VERSION" \
            --generate-notes
