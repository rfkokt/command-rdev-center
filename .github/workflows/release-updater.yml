name: Release updater

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Existing stable GitHub release to deploy (e.g. 0.2.89); no rebuild
        required: true
        type: string
  schedule:
    - cron: "23 3 * * *"

concurrency:
  group: release-updater
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: macos-14
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      TARGET: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          npm ci --ignore-scripts --prefix src-tauri/browser-host
          PLAYWRIGHT_BROWSERS_PATH=src-tauri/browser-host/.browsers npx --prefix src-tauri/browser-host playwright install chromium
          mkdir -p src-tauri/browser-host/runtime
          cp "$(command -v node)" src-tauri/browser-host/runtime/node-aarch64-apple-darwin

      - name: Bump patch version
        id: version
        run: |
          git pull --ff-only origin main
          VERSION="$(node -p 'const [major, minor, patch] = require("./package.json").version.split(".").map(Number); `${major}.${minor}.${patch + 1}`')"
          while git rev-parse --verify --quiet "refs/tags/v$VERSION"; do
            VERSION="$(VERSION="$VERSION" node -p 'const [major, minor, patch] = process.env.VERSION.split(".").map(Number); `${major}.${minor}.${patch + 1}`')"
          done
          VERSION="$VERSION" node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from "node:fs";

          const version = process.env.VERSION;
          for (const file of ["package.json", "src-tauri/tauri.conf.json"]) {
            const value = JSON.parse(readFileSync(file, "utf8"));
            value.version = version;
            writeFileSync(file, `${JSON.stringify(value, null, 2)}\n`);
          }
          for (const file of ["src-tauri/Cargo.toml", "src-tauri/Cargo.lock"]) {
            const value = readFileSync(file, "utf8");
            writeFileSync(file, value.replace(/(name = "command-rdev-center"\nversion = ")[^"]+/, `$1${version}`));
          }
          JS
          pnpm check:version
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          python3 -m unittest discover -s scripts -p 'test_updater_vps.py'
          pnpm test && cargo test --manifest-path src-tauri/Cargo.toml

      - name: Import Apple signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Build self-signed updater
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: pnpm tauri build --target "$TARGET" --bundles app

      - name: Prepare release files
        id: files
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          artifact=$(find src-tauri/target/$TARGET/release/bundle/macos -name '*.app.tar.gz' -type f -print -quit)
          test -n "$artifact"
          test -f "$artifact.sig"
          filename="command-rdev-center_${VERSION}_aarch64.app.tar.gz"
          cp "$artifact" "$RUNNER_TEMP/$filename"
          cp "$artifact.sig" "$RUNNER_TEMP/$filename.sig"
          python3 - "$RUNNER_TEMP/$filename.sig" "$RUNNER_TEMP/latest.json" "$VERSION" "$filename" "$SOURCE_COMMIT" <<'PY'
          import datetime, json, pathlib, sys
          signature_file, output, version, filename, commit = sys.argv[1:]
          payload = {
              "version": version,
              "notes": f"Build {version} ({commit[:7]})",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "platforms": {
                  "darwin-aarch64": {
                      "signature": pathlib.Path(signature_file).read_text().strip(),
                      "url": f"https://updates.rdev.web.id/command-rdev-center/{filename}",
                  }
              },
          }
          pathlib.Path(output).write_text(json.dumps(payload, indent=2) + "\n")
          PY
          echo "artifact=$RUNNER_TEMP/$filename" >> "$GITHUB_OUTPUT"

      - name: Commit and tag release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "chore(release): v$VERSION"
          git tag "v$VERSION"
          git push origin HEAD:main "v$VERSION"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          ARTIFACT: ${{ steps.files.outputs.artifact }}
        run: |
          gh release create "v$VERSION" \
            "$ARTIFACT" \
            "$ARTIFACT.sig" \
            "$RUNNER_TEMP/latest.json" \
            --verify-tag \
            --title "Command RDEV Center v$VERSION" \
            --generate-notes

  deploy:
    needs: release
    if: ${{ always() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Deploy published release to updater VPS
        timeout-minutes: 18
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RELEASE_VERSION: ${{ needs.release.outputs.version || inputs.version }}
        run: bash scripts/run-updater-vps.sh deploy "$RELEASE_VERSION"

  maintenance:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Clean stale updater files
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/run-updater-vps.sh cleanup
